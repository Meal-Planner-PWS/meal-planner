<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#3D6B4F"/>
  <g transform="translate(256,240)">
    <!-- Fork -->
    <g fill="none" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
      <!-- Fork tines -->
      <line x1="-50" y1="-120" x2="-50" y2="-30"/>
      <line x1="-10" y1="-120" x2="-10" y2="-30"/>
      <line x1="30" y1="-120" x2="30" y2="-30"/>
      <!-- Fork base curve -->
      <path d="M-50,-30 C-50,10 30,10 30,-30"/>
      <!-- Fork handle -->
      <line x1="-10" y1="10" x2="-10" y2="160"/>
    </g>
    <!-- Small leaf accent -->
    <g transform="translate(60,-20) rotate(-30)">
      <path d="M0,-50 C20,-50 40,-30 40,0 C40,30 20,50 0,30 C-10,20 -10,-10 0,-50Z" fill="white" fill-opacity="0.25" stroke="white" stroke-width="10" stroke-linejoin="round"/>
      <path d="M0,-30 C5,-10 5,10 0,25" fill="none" stroke="white" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
